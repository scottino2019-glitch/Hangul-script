<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="64" y="64" width="384" height="384" rx="56" fill="#FFFFFF" />
  <line x1="256" y1="88" x2="256" y2="424" stroke="#E2E8F0" stroke-width="4" stroke-dasharray="12 12" />
  <line x1="88" y1="256" x2="424" y2="256" stroke="#E2E8F0" stroke-width="4" stroke-dasharray="12 12" />
  <!-- Stylized Hangul '한' calligraphy strokes -->
  <!-- ㅎ (Cobalt blue) -->
  <path d="M 192 118 L 192 142" stroke="#1D4ED8" stroke-width="24" stroke-linecap="round" />
  <path d="M 124 166 L 260 166" stroke="#1D4ED8" stroke-width="24" stroke-linecap="round" />
  <ellipse cx="192" cy="232" rx="48" ry="42" fill="none" stroke="#1D4ED8" stroke-width="24" />
  <!-- ㅏ (Crimson seal) -->
  <path d="M 326 120 L 326 286" stroke="#DC2626" stroke-width="26" stroke-linecap="round" />
  <path d="M 326 202 L 388 202" stroke="#DC2626" stroke-width="26" stroke-linecap="round" />
  <!-- ㄴ (Sumi ink) -->
  <path d="M 152 320 L 152 392 L 372 392" fill="none" stroke="#0F172A" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
</svg>
